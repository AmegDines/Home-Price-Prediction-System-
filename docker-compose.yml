# =============================================================================
# docker-compose.yml — Local development stack
# Starts the FastAPI backend and Next.js frontend together.
# Listings are stored in a named SQLite volume (no AWS credentials needed).
#
# Usage:
#   docker compose up --build          # build images and start
#   docker compose logs -f             # follow logs
#   docker compose down                # stop, keep volumes
#   docker compose down --volumes      # stop + wipe SQLite data
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI prediction API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: home-price-backend:local
    container_name: home-price-backend
    ports:
      - "8000:8000"
    environment:
      # SQLite mode — no LISTINGS_TABLE set means DynamoDB is not used
      LISTINGS_DB_PATH: /app/data/listings.sqlite3
      CORS_ALLOW_ORIGINS: "http://localhost:3000"
      UVICORN_WORKERS: "1"
    volumes:
      - listings_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - home-price-net

  # ---------------------------------------------------------------------------
  # Frontend — Next.js UI
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Points the browser bundle at the backend
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    image: home-price-frontend:local
    container_name: home-price-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - home-price-net

# ---------------------------------------------------------------------------
# Named volume — persists SQLite listings across container restarts
# ---------------------------------------------------------------------------
volumes:
  listings_data:
    name: home-price-listings

# ---------------------------------------------------------------------------
# Internal bridge network — services talk by container name
# ---------------------------------------------------------------------------
networks:
  home-price-net:
    driver: bridge
