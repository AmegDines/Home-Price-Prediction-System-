services:
  backend:
    image: bengaluru-home-price-api:local
    build:
      context: ./server
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      LISTINGS_TABLE: ""
      LISTINGS_DB_PATH: /app/data/listings.sqlite3
      AWS_REGION: ap-south-1
      CORS_ALLOW_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - listing-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  frontend:
    image: bengaluru-home-price-web:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  listing-data:
