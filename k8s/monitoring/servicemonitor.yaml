# =============================================================================
# k8s/monitoring/servicemonitor.yaml
# Tells Prometheus to scrape the FastAPI /metrics endpoint automatically.
# The FastAPI server already exports Prometheus metrics via prometheus_client.
# (Unit V — Collecting logs and visualizing metrics)
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: home-price-backend
  namespace: monitoring
  labels:
    # Must match the Prometheus serviceMonitorSelector — release=kube-prom
    release: kube-prom
spec:
  namespaceSelector:
    matchNames:
      - home-price
  selector:
    matchLabels:
      app: home-price-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
