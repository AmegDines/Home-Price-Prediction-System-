# =============================================================================
# k8s/frontend/deployment.yaml
# Next.js frontend — 2 replicas with health checks.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-price-frontend
  namespace: home-price
  labels:
    app: home-price-frontend
    version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: home-price-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: home-price-frontend
        version: "0.1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: frontend
          image: 111169963700.dkr.ecr.ap-south-1.amazonaws.com/home-price-frontend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: frontend-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
