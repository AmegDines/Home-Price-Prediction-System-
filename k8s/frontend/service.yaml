# =============================================================================
# k8s/frontend/service.yaml
# NodePort service — exposes the Next.js frontend on port 3000 of the node IP.
# NodePort is used instead of LoadBalancer to avoid extra AWS ELB charges.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: home-price-frontend
  namespace: home-price
  labels:
    app: home-price-frontend
spec:
  type: NodePort
  selector:
    app: home-price-frontend
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30300   # accessible at http://<EC2-IP>:30300
