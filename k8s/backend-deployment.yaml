apiVersion: apps/v1
kind: Deployment

metadata:
  name: home-price-backend
  labels:
    app: home-price-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: home-price-backend

  template:
    metadata:
      labels:
        app: home-price-backend

    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: backend

          image: 111169963700.dkr.ecr.ap-south-1.amazonaws.com/home-price-backend:latest

          ports:
            - containerPort: 8000

          # ── Resource requests & limits ────────────────────────────────────
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          # ── Environment ────────────────────────────────────────────────────
          env:
            - name: MODEL_DIR
              value: /app/model

          # ── Model volume mount ─────────────────────────────────────────────
          volumeMounts:
            - name: model-storage
              mountPath: /app/model
              readOnly: true

          # ── Liveness probe ─────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

          # ── Readiness probe (gates traffic until model is loaded) ──────────
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: model-pvc
  labels:
    app: home-price-backend

spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 500Mi

---
apiVersion: v1
kind: Service

metadata:
  name: home-price-backend-service

spec:
  selector:
    app: home-price-backend

  type: NodePort

  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
