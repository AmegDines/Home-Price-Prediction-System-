apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-price-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-price-backend
  template:
    metadata:
      labels:
        app: home-price-backend
    spec:
      containers:
      - name: backend
        image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/home-price-backend:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: home-price-backend-service
spec:
  selector:
    app: home-price-backend
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000