# =============================================================================
# k8s/backend/deployment.yaml
# FastAPI prediction API — 2 replicas with liveness & readiness probes.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-price-backend
  namespace: home-price
  labels:
    app: home-price-backend
    version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: home-price-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0    # zero-downtime rolling update
      maxSurge: 1
  template:
    metadata:
      labels:
        app: home-price-backend
        version: "2.0.0"
      annotations:
        # Prometheus scrape annotations (Unit V)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # -----------------------------------------------------------------------
      # Security context — run as non-root (Unit V — DevSecOps)
      # -----------------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: backend
          image: 111169963700.dkr.ecr.ap-south-1.amazonaws.com/home-price-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: UVICORN_WORKERS
              value: "1"
          envFrom:
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Readiness probe — pod receives traffic only when model is loaded
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          # Liveness probe — restart pod if it stops responding
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
