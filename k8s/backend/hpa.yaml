# =============================================================================
# k8s/backend/hpa.yaml
# HorizontalPodAutoscaler — scale backend pods between 2 and 6 replicas
# based on CPU utilisation. Keeps response time low under prediction bursts.
# (Unit II — Container Orchestration using Kubernetes)
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: home-price-backend-hpa
  namespace: home-price
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: home-price-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
