# =============================================================================
# k8s/backend/service.yaml
# ClusterIP service — backend is internal only; frontend reaches it by name.
# External access goes through the NGINX ingress.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: home-price-backend
  namespace: home-price
  labels:
    app: home-price-backend
spec:
  type: ClusterIP
  selector:
    app: home-price-backend
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
