# =============================================================================
# k8s/backend/secret.yaml
# Kubernetes Secret for backend environment variables.
#
# IMPORTANT: Replace placeholder values before applying.
# Never commit real values — use `kubectl create secret` or Sealed Secrets.
#
# Apply with:
#   kubectl apply -f k8s/backend/secret.yaml -n home-price
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: home-price
  labels:
    app: home-price-backend
type: Opaque
stringData:
  # DynamoDB table name created by Terraform (terraform output dynamodb_table_name)
  LISTINGS_TABLE: "home-price-listings"
  # AWS region where DynamoDB table lives
  AWS_REGION: "ap-south-1"
  # Comma-separated CORS origins — set to your frontend's public URL
  CORS_ALLOW_ORIGINS: "http://YOUR_APP_SERVER_IP:3000"
